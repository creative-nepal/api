# Local backing services for creative-nepal-api. Values are read from this
# directory's .env, which is the same file the API itself uses — so the
# credentials cannot drift between the container and the client.
services:
  postgres:
    image: postgres:16-alpine
    container_name: creativenepal-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creative_nepal
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: creativenepal-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
